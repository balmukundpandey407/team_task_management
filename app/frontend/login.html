<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/style.css">
    <title>Login</title>
</head>
<body>

<div class="auth-shell">
    <span class="mark">TT</span>
     <strong>Team Task Management</strong>
    <h2>Welcome back</h2>
    <p>Sign in to access your team dashboard and manage tasks.</p>
    <div class="auth-actions">
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button onclick="login()">Login</button>

        <p class="auth-footer">Don't have an account? <a href="/register">Create one</a>.</p>
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
function showToast(message, type = "error") {
    const toast = document.createElement("div");
    toast.className = `toast-message ${type}`;
    toast.textContent = message;
    document.getElementById("toast").appendChild(toast);
    setTimeout(() => toast.remove(), 4200);
}

async function login() {
    try {
        const response = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            })
        });
        const data = await response.json();

        if (!response.ok) {
            showToast(data.detail || "Login failed. Please try again.");
            return;
        }

        localStorage.setItem("token", data.token);

        window.location.href = "/dashboard";

    } catch (error) {
        showToast("Unable to connect. Please try again.");
    }
}
</script>

</body>
</html>
