<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/style.css">
    <title>Register</title>
</head>
<body>  

<div class="auth-shell">
        <span class="mark">TT</span>
     <strong>Team Task Management</strong>
    <h2>Create your account</h2>
    <p>Join the team and start creating tasks, assigning work, and tracking progress.</p>
    <div class="auth-actions">
        <input id="firstName" placeholder="First Name">
        <input id="lastName" placeholder="Last Name">
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button onclick="register()">Register</button>

        <p class="auth-footer">Already have an account? <a href="/login">Login</a>.</p>
    </div>
</div>

<script>
async function register(){
    await fetch("/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            first_name: document.getElementById("firstName").value,
            last_name: document.getElementById("lastName").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        })
    });
}
</script>

</body>
</html>
