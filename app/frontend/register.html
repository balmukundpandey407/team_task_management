<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/style.css">
    <title>Register</title>
</head>
<body>  

<div class="auth-shell">
        <span class="mark">TT</span>
     <strong>Team Task Management</strong>
    <h2>Create your account</h2>
    <p>Join the team and start creating tasks, assigning work, and tracking progress.</p>
    <div class="auth-actions">
        <input id="firstName" placeholder="First Name">
        <input id="lastName" placeholder="Last Name">
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button id="register-button" onclick="register()">Register</button>

        <p class="auth-footer">Already have an account? <a href="/login">Login</a>.</p>
    </div>
</div>
<div id="toast" class="toast" aria-live="polite"></div>

<script>
function showToast(message, type = "error") {
    const toast = document.createElement("div");
    toast.className = `toast-message ${type}`;
    toast.textContent = message;
    document.getElementById("toast").appendChild(toast);
    setTimeout(() => toast.remove(), 4200);
}

async function register(){
    const button = document.getElementById("register-button");
    button.disabled = true;
    button.textContent = "Creating account...";

    try {
        const response = await fetch("/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                first_name: document.getElementById("firstName").value,
                last_name: document.getElementById("lastName").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            })
        });

        if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            showToast(error.detail || "Registration failed. Please try again.");
            return;
        }

        window.location.href = "/login";
    } catch (error) {
        showToast("Unable to connect to the server. Please try again.");
    } finally {
        button.disabled = false;
        button.textContent = "Register";
    }
}
</script>

</body>
</html>
